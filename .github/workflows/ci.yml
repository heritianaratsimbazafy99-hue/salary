name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application gate
        run: npm run verify:ci

  e2e:
    name: E2E Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Supabase
        run: supabase start

      - name: Reset local database
        run: npm run db:reset:local

      - name: Verify database lifecycle and retention
        run: |
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/payroll-retention.sql
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/payroll-manager-review.sql
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/employee-identity.sql
          bash scripts/tests/employee-identity-migration.sh
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < src/test/rls/admin-lifecycle-postflight.sql
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/hr-foundations.sql
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/hr-employee-records.sql
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/hr-employee-documents.sql
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/hr-leaves.sql
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/hr-assignments-replacements.sql
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/hr-requests.sql
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/hr-reporting.sql
          bash scripts/tests/hr-leave-concurrency.sh
          bash scripts/tests/agency-employee-concurrency.sh
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/agency-employee-management.sql
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/agency-employee-imports.sql
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/agency-payroll-invitations.sql
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/employee-email-change.sql
          docker exec -i supabase_db_salary-platform psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/tests/payroll-email-delivery-safety.sql

      - name: Run authenticated browser tests
        run: npm run test:e2e -- --project=chromium

      - name: Run Supabase advisors
        run: npm run db:advisors

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
